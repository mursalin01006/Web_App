<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQLi Shield | AI-Powered Threat Detection</title>
    <!-- Tailwind CSS for modern dark theme -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                        cyberBlue: '#38bdf8',
                        cyberGreen: '#22c55e',
                        cyberRed: '#ef4444'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glow-red { text-shadow: 0 0 10px rgba(239, 68, 68, 0.7); box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
        .glow-green { text-shadow: 0 0 10px rgba(34, 197, 94, 0.7); box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Header -->
    <div class="text-center mb-10 w-full max-w-3xl">
        <h1 class="text-4xl md:text-5xl font-bold mb-3 tracking-tight text-cyberBlue">
            <i class="fas fa-shield-halved mr-3"></i>SQLi Shield
        </h1>
        <p class="text-slate-400 text-lg">AI-Powered SQL Injection Threat Detection Engine</p>
    </div>

    <!-- Main Card -->
    <div class="w-full max-w-3xl glass-panel rounded-2xl p-6 md:p-8 shadow-2xl">
        
        <div class="mb-6">
            <label for="query" class="block text-sm font-medium text-slate-300 mb-2">
                <i class="fas fa-terminal mr-2"></i>Enter Database Query to Analyze
            </label>
            <textarea id="query" rows="5" 
                class="w-full bg-slate-900 text-slate-100 border border-slate-700 rounded-lg p-4 focus:ring-2 focus:ring-cyberBlue focus:border-transparent transition-all font-mono text-sm resize-none"
                placeholder="SELECT * FROM users WHERE username = 'admin' OR 1=1 --"></textarea>
        </div>

        <button id="analyzeBtn" onclick="analyzeQuery()" 
            class="w-full bg-cyberBlue hover:bg-blue-500 text-slate-900 font-bold py-4 px-6 rounded-lg transition-all duration-300 transform hover:scale-[1.02] flex items-center justify-center gap-2">
            <i class="fas fa-microchip"></i>
            Initialize Analysis
        </button>

        <!-- Loading State -->
        <div id="loading" class="hidden mt-8 text-center text-slate-400">
            <i class="fas fa-circle-notch fa-spin text-3xl mb-3 text-cyberBlue"></i>
            <p>Processing via Random Forest Classifier...</p>
        </div>

        <!-- Result Dashboard -->
        <div id="resultBox" class="hidden mt-8">
            <h3 class="text-lg font-semibold text-slate-300 mb-4 uppercase tracking-wider border-b border-slate-700 pb-2">Analysis Report</h3>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                
                <!-- Status Badge -->
                <div class="glass-panel p-5 rounded-xl flex items-center space-x-4">
                    <div id="statusIcon" class="text-4xl"></div>
                    <div>
                        <p class="text-sm text-slate-400 font-semibold uppercase">Detection Status</p>
                        <p id="statusText" class="text-2xl font-bold tracking-wide mt-1"></p>
                    </div>
                </div>

                <!-- Metrics -->
                <div class="glass-panel p-5 rounded-xl flex flex-col justify-center space-y-3">
                    <div class="flex justify-between items-center">
                        <span class="text-slate-400 text-sm"><i class="fas fa-crosshairs mr-2"></i>Confidence Score</span>
                        <span id="confidenceText" class="font-bold text-slate-200"></span>
                    </div>
                    <div class="w-full bg-slate-700 rounded-full h-2">
                        <div id="confidenceBar" class="h-2 rounded-full transition-all duration-1000" style="width: 0%"></div>
                    </div>
                    
                    <div class="flex justify-between items-center pt-2 border-t border-slate-700/50">
                        <span class="text-slate-400 text-sm"><i class="fas fa-stopwatch mr-2"></i>Processing Latency</span>
                        <span id="latencyText" class="font-mono text-slate-200"></span>
                    </div>
                </div>
            </div>

            <div id="descBox" class="p-4 rounded-lg text-center font-medium border">
            </div>
        </div>

    </div>

    <!-- Footer -->
    <div class="mt-12 text-slate-500 text-sm text-center">
        <p>B.Sc. Final Year Thesis Project</p>
        <p class="mt-1">Powered by Machine Learning &copy; 2024</p>
    </div>

    <script>
        async function analyzeQuery() {
            const queryInput = document.getElementById('query').value.trim();
            if (!queryInput) {
                alert('Please enter a query to analyze.');
                return;
            }

            // UI transitions
            document.getElementById('resultBox').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('analyzeBtn').disabled = true;
            document.getElementById('analyzeBtn').classList.add('opacity-50');

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: queryInput })
                });

                const data = await response.json();

                if (response.ok) {
                    displayResults(data);
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to connect to the server.');
            } finally {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('analyzeBtn').disabled = false;
                document.getElementById('analyzeBtn').classList.remove('opacity-50');
            }
        }

        function displayResults(data) {
            document.getElementById('resultBox').classList.remove('hidden');
            
            const isMalicious = data.is_malicious;
            const statusText = document.getElementById('statusText');
            const statusIcon = document.getElementById('statusIcon');
            const confBar = document.getElementById('confidenceBar');
            const descBox = document.getElementById('descBox');

            // Reset classes
            statusText.className = 'text-2xl font-bold tracking-wide mt-1';
            descBox.className = 'p-4 rounded-lg text-center font-medium border transition-all';
            
            if (isMalicious) {
                statusText.innerText = 'MALICIOUS';
                statusText.classList.add('text-cyberRed');
                statusIcon.innerHTML = '<i class="fas fa-skull text-cyberRed"></i>';
                
                confBar.className = 'h-2 rounded-full transition-all duration-1000 bg-cyberRed';
                
                descBox.classList.add('bg-red-900/20', 'border-red-500/50', 'text-red-400');
                descBox.innerText = '⚠️ ' + data.description;
            } else {
                statusText.innerText = 'SAFE';
                statusText.classList.add('text-cyberGreen');
                statusIcon.innerHTML = '<i class="fas fa-check-circle text-cyberGreen"></i>';
                
                confBar.className = 'h-2 rounded-full transition-all duration-1000 bg-cyberGreen';
                
                descBox.classList.add('bg-green-900/20', 'border-green-500/50', 'text-green-400');
                descBox.innerText = '✅ ' + data.description;
            }

            document.getElementById('confidenceText').innerText = data.confidence + '%';
            document.getElementById('latencyText').innerText = data.latency_ms + ' ms';
            
            // Animate progress bar
            setTimeout(() => {
                confBar.style.width = data.confidence + '%';
            }, 100);
        }
    </script>
</body>
</html>
